<div class="card" data-card-id="card-14">
  <style>
    .card[data-card-id="card-14"] .root{width:100%;height:100%;position:relative;font-family:'Manrope',sans-serif;color:var(--text);}
    .card[data-card-id="card-14"] .panel{position:absolute;background:rgba(12,16,32,.88);border:1px solid rgba(255,255,255,.09);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);}
    .card[data-card-id="card-14"] .kicker{font-family:'Manrope',sans-serif;font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px;}
    .card[data-card-id="card-14"] .bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-bottom:18px;}
    .card[data-card-id="card-14"] .title{font-family:'Rubik',sans-serif;font-weight:800;color:#fafafa;margin:0;line-height:1.08;letter-spacing:-.01em;}
    .card[data-card-id="card-14"] .detail{font-family:'Manrope',sans-serif;font-weight:400;font-size:28px;line-height:1.4;color:#aab2c8;margin:16px 0 0;}
    .card[data-card-id="card-14"] .char{display:inline-block;}
  
</style>
  <div class="root" style="--accent:#6d9dff;">
    
      <div class="panel" style="left:64px;top:64px;width:1200px;padding:48px 56px;">
        <p class="kicker" id="card-14-kicker" data-anim="fade-in" data-anim-at="0.05" data-anim-duration="0.35" >&#9888;&nbsp; UN DOCENTE</p>
        <div class="bar" id="card-14-bar" style="width:0;" data-anim="grow-x" data-anim-at="0.2" data-anim-duration="0.45" data-anim-target-w="120"></div>
        <h1 class="title" id="card-14-title" style="font-size:56px;" data-anim="slide-in" data-anim-at="0.25" data-anim-duration="0.45" data-anim-from="left" data-anim-distance="40">Responde el mismo correo, una y otra vez</h1>
        <p class="detail" id="card-14-detail" data-anim="fade-in" data-anim-at="0.5" data-anim-duration="0.4">Las mismas preguntas repetidas de los padres de familia</p>
      </div>
  </div>
</div>
