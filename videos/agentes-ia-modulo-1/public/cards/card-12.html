<div class="card" data-card-id="card-12">
  <style>
    .card[data-card-id="card-12"] .root{width:100%;height:100%;position:relative;font-family:'Manrope',sans-serif;color:var(--text);}
    .card[data-card-id="card-12"] .panel{position:absolute;background:rgba(12,16,32,.88);border:1px solid rgba(255,255,255,.09);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);}
    .card[data-card-id="card-12"] .kicker{font-family:'Manrope',sans-serif;font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px;}
    .card[data-card-id="card-12"] .bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-bottom:18px;}
    .card[data-card-id="card-12"] .title{font-family:'Rubik',sans-serif;font-weight:800;color:#fafafa;margin:0;line-height:1.08;letter-spacing:-.01em;}
    .card[data-card-id="card-12"] .detail{font-family:'Manrope',sans-serif;font-weight:400;font-size:28px;line-height:1.4;color:#aab2c8;margin:16px 0 0;}
    .card[data-card-id="card-12"] .char{display:inline-block;}
  
</style>
  <div class="root" style="--accent:#3976ff;">
    
      <div style="position:absolute;left:64px;top:64px;width:820px;">
        <p class="kicker" id="card-12-kicker" data-anim="fade-in" data-anim-at="0.05" data-anim-duration="0.35" >ESTE CURSO ES DISTINTO</p>
      </div>
      <div class="panel" style="left:64px;top:170px;width:390px;height:640px;padding:38px;border-color:rgba(255,80,80,.25);" >
        <p class="kicker" style="color:#ff6b6b;" id="card-12-l-label" data-anim="fade-in" data-anim-at="0.25" data-anim-duration="0.3">&#10007;&nbsp; Otros cursos</p>
        <p class="detail" id="card-12-l-text" style="font-size:32px;color:#e8ebf5;" data-anim="fade-in" data-anim-at="0.35" data-anim-duration="0.35">Usar una herramienta ya hecha</p>
      </div>
      <div class="panel" style="left:494px;top:170px;width:390px;height:640px;padding:38px;border-color:rgba(42,210,104,.35);">
        <p class="kicker" style="color:#2ad268;" id="card-12-r-label" data-anim="fade-in" data-anim-at="0.45" data-anim-duration="0.3">&#10003;&nbsp; Este curso</p>
        <p class="detail" id="card-12-r-text" style="font-size:32px;color:#e8ebf5;" data-anim="fade-in" data-anim-at="0.55" data-anim-duration="0.35">Construir tu propio asistente de IA</p>
      </div>
  </div>
</div>
