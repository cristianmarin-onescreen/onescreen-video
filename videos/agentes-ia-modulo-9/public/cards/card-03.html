<div class="card" data-card-id="card-03">
  <style>
    .card[data-card-id="card-03"] .root{width:100%;height:100%;position:relative;font-family:'Manrope',sans-serif;color:var(--text);}
    .card[data-card-id="card-03"] .panel{position:absolute;background:rgba(12,16,32,.88);border:1px solid rgba(255,255,255,.09);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);}
    .card[data-card-id="card-03"] .kicker{font-family:'Manrope',sans-serif;font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px;}
    .card[data-card-id="card-03"] .bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-bottom:18px;}
    .card[data-card-id="card-03"] .title{font-family:'Rubik',sans-serif;font-weight:800;color:#fafafa;margin:0;line-height:1.08;letter-spacing:-.01em;}
    .card[data-card-id="card-03"] .detail{font-family:'Manrope',sans-serif;font-weight:400;font-size:28px;line-height:1.4;color:#aab2c8;margin:16px 0 0;}
    .card[data-card-id="card-03"] .char{display:inline-block;}
    .card[data-card-id="card-03"] .item{display:flex;align-items:flex-start;gap:16px;}
    .card[data-card-id="card-03"] .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:12px;flex:none;}
    .card[data-card-id="card-03"] .item-text{font-family:'Manrope',sans-serif;font-weight:500;font-size:30px;color:#e8ebf5;line-height:1.35;}
  
</style>
  <div class="root" style="--accent:#3976ff;">
    
      <div class="panel" style="left:64px;top:64px;width:min(1200px, calc(100% - 128px));padding:48px 56px;">
        <p class="kicker" id="card-03-kicker" data-anim="fade-in" data-anim-at="0.05" data-anim-duration="0.35">ANTES DE EMPEZAR</p>
        <div class="bar" id="card-03-bar" style="width:0;" data-anim="grow-x" data-anim-at="0.2" data-anim-duration="0.45" data-anim-target-w="120"></div>
        <h1 class="title" id="card-03-title" style="font-size:56px;" data-anim="slide-in" data-anim-at="0.25" data-anim-duration="0.45" data-anim-from="left" data-anim-distance="40">No vas a necesitar código</h1>
        <p class="detail" id="card-03-detail" data-anim="fade-in" data-anim-at="0.5" data-anim-duration="0.4">Ni ningún conocimiento técnico especial</p>
      </div>
  </div>
</div>
