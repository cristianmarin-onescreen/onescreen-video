        <script>
          (function () {
            const tl = gsap.timeline({ paused: true });

            const PASTELS = ["#FE90E8", "#C0F7FE", "#2ad268", "#F7CB46", "#FFFDF5"];
            const GROUP_IDS = ["g1", "g2", "g3", "g4", "g5", "g6", "g7", "g8", "g9"];

            // ---- initial baseline: only g1 visible at t=0 ----
            GROUP_IDS.forEach((id) => {
              tl.set("#" + id, { autoAlpha: id === "g1" ? 1 : 0 }, 0);
            });
            tl.set("#shake-wrapper", { x: 0, y: 0 }, 0);
            tl.set("#tension-meter", { autoAlpha: 0 }, 0);

            // ================= karaoke pill-line builder (g1 / g2 / g9) =================
            function buildPillLine(lineSelId, words, anchors, fontSizePx) {
              const container = document.querySelector(lineSelId);
              const els = words.map((w, i) => {
                const span = document.createElement("span");
                span.className = "word-pill";
                span.textContent = w;
                span.style.background = PASTELS[i % PASTELS.length];
                span.style.fontSize = fontSizePx + "px";
                container.appendChild(span);
                return span;
              });
              els.forEach((el, i) => {
                tl.set(el, { rotation: i % 2 === 0 ? -2 : 2, transformOrigin: "50% 50%" }, 0);
              });
              els.forEach((el, i) => {
                tl.fromTo(
                  el,
                  { opacity: 0, scale: 1.3 },
                  { opacity: 1, scale: 1, duration: 0.14, ease: "back.out(2.2)" },
                  anchors[i],
                );
              });
            }

            buildPillLine(
              "#g1-line",
              ["Yulian,", "Yulian,", "tranquilo,", "respira", "ya,"],
              [0, 1.676, 3.352, 5.746, 7.422],
              86,
            );
            buildPillLine(
              "#g2-line",
              ["que", "de", "tanto", "estrés", "ese", "Gurú", "te", "va", "a", "jubilar."],
              [8.14, 8.807, 9.251, 10.362, 11.696, 12.362, 13.251, 13.696, 14.14, 14.362],
              56,
            );
            buildPillLine(
              "#g9-line",
              ["Y", "él", "con", "cara", "de:", "“Eso", "toca", "revisarlo…”"],
              [25.44, 25.495, 25.605, 25.77, 25.99, 26.155, 26.375, 26.595],
              60,
            );

            // ================= alert-banner builder (g3 / g5 / g7) =================
            function buildAlertBanner(cfg) {
              const wordsHost = document.querySelector(cfg.wordsSel);
              const els = cfg.words.map((w) => {
                const span = document.createElement("span");
                span.className = "alert-word";
                span.textContent = w;
                span.style.fontSize = cfg.fontSizePx + "px";
                wordsHost.appendChild(span);
                return span;
              });

              const banner = document.querySelector(cfg.bannerSel);
              tl.set(banner, { backgroundColor: cfg.bg, boxShadow: cfg.shadow }, 0);

              els.forEach((el, i) => {
                tl.fromTo(
                  el,
                  { opacity: 0, y: 14 },
                  { opacity: 1, y: 0, duration: 0.1, ease: "power2.out" },
                  cfg.anchors[i],
                );
              });

              // deterministic finite blink on the icon: floor, not ceil (no overshoot)
              const cycle = cfg.blinkDur;
              const bannerSpan = cfg.end - cfg.start;
              const repeat = Math.max(0, Math.floor(bannerSpan / cycle) - 1);
              tl.to(
                cfg.iconSel,
                { opacity: 0.15, duration: cycle, repeat: repeat, yoyo: true, ease: "none" },
                cfg.start,
              );
            }

            buildAlertBanner({
              bannerSel: "#g3-banner",
              wordsSel: "#g3-words",
              iconSel: "#g3-icon",
              words: ["Pantalla", "sin", "señal…"],
              anchors: [16.14, 17.316, 17.758],
              start: 16.14,
              end: 18.64,
              bg: "#F7CB46",
              shadow: "8px 8px 0 #000",
              blinkDur: 0.18,
              fontSizePx: 92,
            });
            buildAlertBanner({
              bannerSel: "#g5-banner",
              wordsSel: "#g5-words",
              iconSel: "#g5-icon",
              words: ["Internet", "caído…"],
              anchors: [19.64, 20.783],
              start: 19.64,
              end: 21.64,
              bg: "#FE90E8",
              shadow: "10px 10px 0 #000",
              blinkDur: 0.12,
              fontSizePx: 100,
            });
            buildAlertBanner({
              bannerSel: "#g7-banner",
              wordsSel: "#g7-words",
              iconSel: "#g7-icon",
              words: ["El", "cliente", "está", "llamando…"],
              anchors: [22.64, 22.822, 23.458, 23.822],
              start: 22.64,
              end: 24.64,
              bg: "#FE90E8",
              shadow: "12px 12px 0 #000",
              blinkDur: 0.08,
              fontSizePx: 84,
            });

            // ================= shout climax builder (g4 / g6 / g8) =================
            function addShake(targetSel, startTime, magnitude) {
              // deterministic decaying jitter — index-derived, no randomness
              const pattern = [1, -0.85, 0.6, -0.45, 0.25, -0.1, 0];
              pattern.forEach((mult, i) => {
                tl.set(
                  targetSel,
                  {
                    x: magnitude * mult,
                    y: i % 2 === 0 ? magnitude * 0.35 * mult : -magnitude * 0.35 * mult,
                  },
                  startTime + i * 0.028,
                );
              });
            }

            function buildShout(cfg) {
              tl.set(cfg.panelSel, { backgroundColor: cfg.bg, boxShadow: cfg.panelShadow }, 0);
              tl.set(cfg.mainSel, { color: cfg.mainColor }, 0);
              tl.set([cfg.rSel, cfg.gSel, cfg.bSel, cfg.mainSel], { opacity: 0, scale: cfg.scaleFrom }, 0);
              tl.set(cfg.rSel, { x: -cfg.chroma * 0.3 }, 0);
              tl.set(cfg.gSel, { x: cfg.chroma * 0.3 }, 0);
              tl.set(cfg.bSel, { x: 0 }, 0);
              tl.set(cfg.flashSel, { opacity: 0 }, 0);

              const t0 = cfg.start;
              // impact flash
              tl.set(cfg.flashSel, { opacity: 1 }, t0);
              // reveal + punch-scale, chroma layers snap wide
              tl.to(
                [cfg.rSel, cfg.gSel, cfg.bSel, cfg.mainSel],
                { opacity: 1, scale: 1, duration: 0.11, ease: "back.out(3)" },
                t0 + 0.02,
              );
              tl.set(cfg.rSel, { x: -cfg.chroma }, t0 + 0.02);
              tl.set(cfg.gSel, { x: cfg.chroma }, t0 + 0.02);
              tl.set(cfg.bSel, { x: cfg.chroma * 0.4 }, t0 + 0.02);
              // flash clears fast
              tl.set(cfg.flashSel, { opacity: 0 }, t0 + 0.05);
              // chroma settles toward a smaller residual offset
              tl.to(cfg.rSel, { x: -cfg.chroma * 0.28, duration: 0.18, ease: "power2.out" }, t0 + 0.09);
              tl.to(cfg.gSel, { x: cfg.chroma * 0.28, duration: 0.18, ease: "power2.out" }, t0 + 0.09);
              tl.to(cfg.bSel, { x: 0, duration: 0.18, ease: "power2.out" }, t0 + 0.09);

              addShake("#shake-wrapper", t0, cfg.shakeMag);

              if (cfg.doublePulse) {
                tl.set(cfg.flashSel, { opacity: 0.9 }, t0 + cfg.doublePulse);
                tl.set(cfg.flashSel, { opacity: 0 }, t0 + cfg.doublePulse + 0.035);
                tl.set([cfg.rSel, cfg.gSel], { x: "+=6" }, t0 + cfg.doublePulse);
                tl.to(
                  [cfg.rSel, cfg.gSel],
                  { x: "-=6", duration: 0.1, ease: "power2.out" },
                  t0 + cfg.doublePulse + 0.035,
                );
              }
            }

            buildShout({
              panelSel: "#g4-panel",
              rSel: "#g4-r",
              gSel: "#g4-g",
              bSel: "#g4-b",
              mainSel: "#g4-main",
              flashSel: "#g4-flash",
              start: 18.64,
              bg: "#FE90E8",
              panelShadow: "8px 8px 0 #000",
              mainColor: "#000000",
              scaleFrom: 1.5,
              chroma: 8,
              shakeMag: 6,
              doublePulse: null,
            });
            buildShout({
              panelSel: "#g6-panel",
              rSel: "#g6-r",
              gSel: "#g6-g",
              bSel: "#g6-b",
              mainSel: "#g6-main",
              flashSel: "#g6-flash",
              start: 21.64,
              bg: "#F7CB46",
              panelShadow: "10px 10px 0 #000",
              mainColor: "#000000",
              scaleFrom: 1.75,
              chroma: 14,
              shakeMag: 11,
              doublePulse: 0.4,
            });
            buildShout({
              panelSel: "#g8-panel",
              rSel: "#g8-r",
              gSel: "#g8-g",
              bSel: "#g8-b",
              mainSel: "#g8-main",
              flashSel: "#g8-flash",
              start: 24.64,
              bg: "#000000",
              panelShadow: "12px 12px 0 #F7CB46",
              mainColor: "#FFFDF5",
              scaleFrom: 2.0,
              chroma: 22,
              shakeMag: 18,
              doublePulse: 0.28,
            });

            // ================= tension meter — real hi-hat roll (114.567–122.369s) =================
            // local time = track time - 96.86 (frame start)
            const ROLL_LOCAL_START = 17.707;
            const ROLL_LOCAL_END = 25.509;
            const ROLL_HITS = 41;
            const rollStep = (ROLL_LOCAL_END - ROLL_LOCAL_START) / ROLL_HITS;

            const track = document.getElementById("tension-track");
            const ticks = [];
            for (let i = 0; i < ROLL_HITS; i++) {
              const tick = document.createElement("div");
              tick.className = "tick";
              track.appendChild(tick);
              ticks.push(tick);
            }
            ticks.forEach((tick, i) => {
              const hitTime = ROLL_LOCAL_START + i * rollStep;
              tl.set(tick, { backgroundColor: "#FE90E8" }, hitTime);
            });

            // meter visible from the first crisis alert through the third shout
            tl.set("#tension-meter", { autoAlpha: 1 }, 16.14);
            tl.set("#tension-meter", { autoAlpha: 0 }, 25.44);

            // ================= group cuts (0ms swaps) =================
            const CUTS = [
              ["#g1", 0, 8.14],
              ["#g2", 8.14, 16.14],
              ["#g3", 16.14, 18.64],
              ["#g4", 18.64, 19.64],
              ["#g5", 19.64, 21.64],
              ["#g6", 21.64, 22.64],
              ["#g7", 22.64, 24.64],
              ["#g8", 24.64, 25.44],
              ["#g9", 25.44, 27.2],
            ];
            CUTS.forEach(([sel, start, end]) => {
              if (start > 0) tl.set(sel, { autoAlpha: 1 }, start);
              tl.set(sel, { autoAlpha: 0 }, end);
            });

            window.__timelines = window.__timelines || {};
            window.__timelines["06-f6"] = tl;
            tl.seek(0);
          })();
        </script>

    </template>
