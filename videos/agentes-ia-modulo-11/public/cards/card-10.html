<div class="card" data-card-id="card-10">
  <style>
    .card[data-card-id="card-10"] .root{width:100%;height:100%;position:relative;font-family:'Manrope',sans-serif;color:var(--text);}
    .card[data-card-id="card-10"] .panel{position:absolute;background:rgba(12,16,32,.88);border:1px solid rgba(255,255,255,.09);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);}
    .card[data-card-id="card-10"] .kicker{font-family:'Manrope',sans-serif;font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px;}
    .card[data-card-id="card-10"] .bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-bottom:18px;}
    .card[data-card-id="card-10"] .title{font-family:'Rubik',sans-serif;font-weight:800;color:#fafafa;margin:0;line-height:1.08;letter-spacing:-.01em;}
    .card[data-card-id="card-10"] .detail{font-family:'Manrope',sans-serif;font-weight:400;font-size:28px;line-height:1.4;color:#aab2c8;margin:16px 0 0;}
    .card[data-card-id="card-10"] .char{display:inline-block;}
    .card[data-card-id="card-10"] .item{display:flex;align-items:flex-start;gap:16px;}
    .card[data-card-id="card-10"] .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:12px;flex:none;}
    .card[data-card-id="card-10"] .item-text{font-family:'Manrope',sans-serif;font-weight:500;font-size:30px;color:#e8ebf5;line-height:1.35;}
  
</style>
  <div class="root" style="--accent:#7d00ba;">
    
      <div class="panel" style="left:50%;top:50%;transform:translate(-50%,-50%);width:min(1300px, calc(100% - 128px));padding:64px 72px;text-align:center;">
        <div style="font-family:'Rubik';font-size:110px;color:#7d00ba;opacity:.5;line-height:.4;">&#8220;</div>
        <h1 class="title" id="card-10-title" style="font-size:64px;font-weight:700;" data-anim="fade-in" data-anim-at="0.2" data-anim-duration="0.6">Activar una herramienta no es darle permiso ilimitado.</h1>
        
      </div>
  </div>
</div>
