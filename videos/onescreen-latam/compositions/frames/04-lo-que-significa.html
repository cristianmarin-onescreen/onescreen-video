      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Measure each checkmark path and set up its stroke-draw dash pattern
          // (svg-path-draw rule) — must run before the timeline references it.
          var checkPaths = [
            document.getElementById("f04-check-0"),
            document.getElementById("f04-check-1"),
            document.getElementById("f04-check-2"),
          ];
          checkPaths.forEach(function (p) {
            var len = p.getTotalLength();
            p.style.strokeDasharray = String(len);
            p.style.strokeDashoffset = String(len);
          });

          var tl = gsap.timeline({ paused: true });

          // --- Scene 1 (0.0-4.0s): quiet open, then the intro clause lands ---
          // A small accent-line draw gives the open a touch of life before the
          // eyebrow arrives on its VO cue (the clause's tail: "...mucho más que
          // solo tecnología"), landing well before the list begins at 4.0s.
          tl.fromTo(
            "#f04-accent",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.45, ease: "power2.out" },
            0.2,
          );

          var EYEBROW_START = 2.3;
          var WORD_STAGGER = 0.15;
          gsap.utils.toArray("#f04-eyebrow .f04-word").forEach(function (w, i) {
            tl.fromTo(
              w,
              { opacity: 0, y: 14 },
              { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
              EYEBROW_START + i * WORD_STAGGER,
            );
          });

          // --- Scenes 2-4: each benefit line accumulates into its slot on its
          // VO cue — marker spring-pop, check-draw, then the text slides into
          // view. Lines stay co-resident (BUILD sub-mode), never replaced.
          var ROW_STARTS = [4.1, 8.1, 11.6];
          ROW_STARTS.forEach(function (startAt, i) {
            tl.fromTo(
              "#f04-marker-" + i,
              { scale: 0, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
              startAt,
            );
            tl.to(
              "#f04-check-" + i,
              { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
              startAt + 0.2,
            );
            tl.fromTo(
              "#f04-text-" + i,
              { opacity: 0, x: 22 },
              { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
              startAt + 0.25,
            );
          });

          // --- Held read (~12.55s-15.232s): the completed 3-line list settles
          // with a gentle parallax/sine float, amplitude split across the 3
          // concurrent rows (/ sqrt(3)) per the concurrent-elements rule.
          var FLOAT_START = 12.55;
          var FLOAT_DUR = 15.232 - FLOAT_START;
          var rows = [
            document.getElementById("f04-row-0"),
            document.getElementById("f04-row-1"),
            document.getElementById("f04-row-2"),
          ];
          var CONCURRENT = Math.sqrt(3);
          var Y_AMP = 2.2 / CONCURRENT;
          var phase = { p: 0 };
          tl.to(
            phase,
            {
              p: Math.PI * 2,
              duration: FLOAT_DUR,
              ease: "none",
              onUpdate: function () {
                rows.forEach(function (row, i) {
                  var offset = Math.sin(phase.p + i * (Math.PI / 2)) * Y_AMP;
                  row.style.transform = "translateY(" + offset.toFixed(2) + "px)";
                });
              },
            },
            FLOAT_START,
          );

          window.__timelines["04-lo-que-significa"] = tl;
        })();
      </script>
