        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            window.__timelines = window.__timelines || {};
            var tl = gsap.timeline({ paused: true });

            // --- Scene 1 (0.0–0.6s): converging dot-grid + "Esa cosa." hard-cut ---
            // 9 dots, deterministic angular placement, converge from a wide scatter
            // (the Frame-2 orbit carrying over) into a tight ~10%-of-frame cluster.
            var DOT_COUNT = 9;
            var INITIAL_R = 300;
            var FINAL_R = 85;
            var CONVERGE_DUR = 0.5;
            var CONVERGE_STAGGER = 0.015;

            for (var i = 0; i < DOT_COUNT; i++) {
              var angle = (i / DOT_COUNT) * Math.PI * 2 + (i % 2 === 0 ? 0 : 0.28);
              var fromX = Math.cos(angle) * INITIAL_R;
              var fromY = Math.sin(angle) * INITIAL_R;
              var toX = Math.cos(angle) * FINAL_R;
              var toY = Math.sin(angle) * FINAL_R;

              tl.fromTo(
                "#f03-dot-" + i,
                { x: fromX, y: fromY },
                {
                  x: toX,
                  y: toY,
                  duration: CONVERGE_DUR,
                  ease: "power3.out",
                },
                i * CONVERGE_STAGGER,
              );
            }

            // "Esa cosa." hard-cuts in above the still-converging cluster — an
            // instant discrete-state jump, no fade/slide (discrete-text-sequence).
            tl.set("#f03-esa-line", { opacity: 1 }, 0.28);

            // --- Scene 2 (0.6–1.765s): scale-swap into the cobalt lockup ---
            var SWAP_TRIGGER = 0.6;
            var EXIT_DUR = 0.15;
            var OVERLAP = 0.1;
            var ENTER_DUR = 0.45;
            var ENTER_AT = SWAP_TRIGGER + EXIT_DUR - OVERLAP;

            // "Esa cosa." hard-cuts out exactly as the resolve beat begins.
            tl.set("#f03-esa-line", { opacity: 0 }, SWAP_TRIGGER);

            // Outgoing: the tight dot cluster collapses toward its own center —
            // shared transform-origin with the incoming pill.
            tl.to(
              "#f03-dot-cluster",
              {
                scale: 0.3,
                opacity: 0,
                duration: EXIT_DUR,
                ease: "power2.in",
              },
              SWAP_TRIGGER,
            );

            // Incoming: the solid-cobalt lockup lands — the one sanctioned
            // restrained spring-pop settle (minimal overshoot, not a hard back.out).
            tl.fromTo(
              "#f03-logo-pill",
              { scale: 0.3, opacity: 0 },
              {
                scale: 1,
                opacity: 1,
                duration: ENTER_DUR,
                ease: "back.out(1.15)",
              },
              ENTER_AT,
            );

            // "Es una OneScreen." hard-cuts in beneath the settled lockup, then
            // holds — the deliberate breather-beat stillness to the end.
            tl.set("#f03-es-una-line", { opacity: 1 }, ENTER_AT + ENTER_DUR);

            window.__timelines["03-la-revelacion"] = tl;
          })();
