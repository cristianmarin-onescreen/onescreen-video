      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // — Scene 1 (0.0–3.0s): per-word staggered reveal of the first clause, paced to the
        // voiceover which starts speaking at t=0. Words settle with a long-tail power3 ease

        const words1 = gsap.utils.toArray("#line1 .word");
        words1.forEach((el, i) => {
          tl.fromTo(
            el,
            { y: 18, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
            0.05 + i * 0.08,
          );
        });

        // — Scene 2 seam (t=3.0s): instant hard cut, no fade/slide — sub-shape A of
        // kinetic-type-beats swaps the whole line in place. Line 1 vanishes, line 2 appears
        // already resolved (discrete-text-sequence: whole-state swap at a time threshold).
        tl.set("#line1", { opacity: 0 }, 3.0);
        tl.set("#line2", { opacity: 1 }, 3.0);

        // — Scene 2 (3.0–6.78s): the dot-grid wakes up — a low-amplitude center-outward
        // expansion. Each dot drifts ~30% further from center and brightens 0.08 -> 0.15,
        // a light per-dot stagger keeps it organic rather than a mechanical chord. Holds
        // static for the final ~0.3s (no exit — this is a non-final-frame hard cut to the
        // next frame handled by the harness transition, not an authored exit tween).
        const dots = [
          { el: "#dot0", bx: -90, by: -90 },
          { el: "#dot1", bx: 0, by: -90 },
          { el: "#dot2", bx: 90, by: -90 },
          { el: "#dot3", bx: -90, by: 0 },
          { el: "#dot4", bx: 0, by: 0 },
          { el: "#dot5", bx: 90, by: 0 },
          { el: "#dot6", bx: -90, by: 90 },
          { el: "#dot7", bx: 0, by: 90 },
          { el: "#dot8", bx: 90, by: 90 },
        ];
        dots.forEach((d, i) => {
          const dx = d.bx * 0.3; // additional outward travel (base * 1.3 - base)
          const dy = d.by * 0.3;
          tl.fromTo(
            d.el,
            { x: 0, y: 0, opacity: 0.08 },
            { x: dx, y: dy, opacity: 0.15, duration: 3.2, ease: "power3.out" },
            3.0 + i * 0.03,
