      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // — Scene 1 (0.0–3.0s): the anchor statement "Creemos en eso." fades in while
        // scaling ~95% -> 100%, one smooth power3 settle (scale-swap-transition, restrained
        // in/settle variant). Visible well before 0.5s so the hero reads immediately. Holds
        // static to the seam at 3.0s.
        tl.fromTo(
          "#block0",
          { scale: 0.95, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
          0.1,
        );

        const EXIT_DUR = 0.5;
        const OVERLAP = 0.15;
        const ENTER_DUR = 0.65;

        // — Scene 2 seam (t=3.0s): the ONE slide-up crossfade — block0 translates up + fades
        // out while the paired statement (block1) translates up from below and fades in to
        // take its place. This single crossfade is the whole move; everything else below is
        // internal choreography riding inside it, paced to the voiceover reaching each half
        // of "la educación normal, en educación del futuro."
        const T2 = 3.0;
        tl.to("#block0", { y: -36, opacity: 0, duration: EXIT_DUR, ease: "power2.in" }, T2);
        tl.fromTo(
          "#block1",
          { y: 40, opacity: 0 },
          { y: 0, opacity: 1, duration: ENTER_DUR, ease: "power3.out" },
          T2 + EXIT_DUR - OVERLAP,
        );

        // "educación del futuro" (near-black) lands a beat after "la educación normal"
        // (muted, already carried by the block's own fade) — the VO reaches the future-state
        // clause slightly later in the sentence.
        const T2_FUTURE = T2 + EXIT_DUR - OVERLAP + 0.3;
        tl.fromTo(
          "#block1-future-wrap",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out" },
          T2_FUTURE,
        );

        // the cobalt underline mark draws left -> right beneath the future-state word once it
        // has landed — the one accent touch (never a cobalt headline).
        const T2_UNDERLINE = T2_FUTURE + 0.45;
        tl.fromTo(
          "#block1-underline",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power2.out" },
          T2_UNDERLINE,
        );

        // Holds settled on this pair through the rest of its VO window (to 7.5s).

        // — Scene 3 seam (t=7.5s): the second slide-up crossfade, same shape — block1 exits,
        // block2 (the second pair) enters, paced to "En transformar empresas, en empresas
        // del futuro."
        const T3 = 7.5;
        tl.to("#block1", { y: -36, opacity: 0, duration: EXIT_DUR, ease: "power2.in" }, T3);
        tl.fromTo(
          "#block2",
          { y: 40, opacity: 0 },
          { y: 0, opacity: 1, duration: ENTER_DUR, ease: "power3.out" },
          T3 + EXIT_DUR - OVERLAP,
        );

        const T3_FUTURE = T3 + EXIT_DUR - OVERLAP + 0.3;
        tl.fromTo(
          "#block2-future-wrap",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out" },
          T3_FUTURE,
        );

        const T3_UNDERLINE = T3_FUTURE + 0.45;
        tl.fromTo(
          "#block2-underline",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power2.out" },
          T3_UNDERLINE,
        );

        // Holds settled on this final pair to the end of the frame (12.492s) — the deliberate
        // calm close of the belief beat; no further development, no exit tween (the harness
        // transition_in owns the cut into Frame 6).

        window.__timelines["05-en-lo-que-creemos"] = tl;
      </script>
