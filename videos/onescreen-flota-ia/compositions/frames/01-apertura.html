          var nodes = q(".s1-node");
          FX.pop(tl, nodes, T(10.6), { stagger: 0.12 });
          nodes.forEach(function (n, i) { FX.draw(tl, n.querySelectorAll("[data-draw]"), T(10.75 + i * 0.12), 0.8); });
