<div class="card" data-card-id="card-24">
  <style>
    .card[data-card-id="card-24"] .root{width:100%;height:100%;position:relative;font-family:'Manrope',sans-serif;color:var(--text);}
    .card[data-card-id="card-24"] .panel{position:absolute;background:rgba(12,16,32,.88);border:1px solid rgba(255,255,255,.09);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);}
    .card[data-card-id="card-24"] .kicker{font-family:'Manrope',sans-serif;font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px;}
    .card[data-card-id="card-24"] .bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-bottom:18px;}
    .card[data-card-id="card-24"] .title{font-family:'Rubik',sans-serif;font-weight:800;color:#fafafa;margin:0;line-height:1.08;letter-spacing:-.01em;}
    .card[data-card-id="card-24"] .detail{font-family:'Manrope',sans-serif;font-weight:400;font-size:28px;line-height:1.4;color:#aab2c8;margin:16px 0 0;}
    .card[data-card-id="card-24"] .char{display:inline-block;}
    .card[data-card-id="card-24"] .item{display:flex;align-items:flex-start;gap:16px;}
    .card[data-card-id="card-24"] .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:12px;flex:none;}
    .card[data-card-id="card-24"] .item-text{font-family:'Manrope',sans-serif;font-weight:500;font-size:30px;color:#e8ebf5;line-height:1.35;}
  
</style>
  <div class="root" style="--accent:#3976ff;">
    
      <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(1100px, calc(100% - 128px));">
        <img src="assets/logos/onescreen-white.png" alt="OneScreen" style="height:70px;margin-bottom:36px;" id="card-24-logo" data-anim="fade-in" data-anim-at="0.15" data-anim-duration="0.5" />
        <h1 class="title" id="card-24-title" style="font-size:58px;" data-anim="fade-in" data-anim-at="0.4" data-anim-duration="0.6">Nos vemos en el examen</h1>
      </div>
  </div>
</div>
