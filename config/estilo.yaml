# Todo lo calibrable vive aquí. "(cal)" = calibrado contra las referencias; "(prov)" = provisional.
entrada:
  conversion_lut: auto         # se busca por cabecera TITLE "Sony S-Log3 to Rec.709"
  rango: auto                  # auto | full | limited (OJO: en fuentes yuvj420p ffmpeg ignora "limited")
  matriz: bt709
normalizacion:
  espacio: post_lut            # post_lut | linear
  fuerza: 0.0                  # (cal 21-oct-2026) con fuerza 0 el azul/verde coincide con su grado (dlnB/G +0.014, sd 0.025); con 1.0 queda +0.054, sd 0.043
  percentil_blancos: 2.0       # % de la superficie válida más clara
  excluir_sobre: 0.95          # luminancia: fuentes de luz
  luminancia_min: 0.20
  clip_canal: 0.985
  abrir_frac: 0.03             # ancho mínimo de la región, fracción del ancho del frame
  area_min_frac: 0.0005
  sat_max: 0.25
  min_candidatos: 300
  dispersion_max: 0.04
  max_shift: 0.35              # (prov)
  frames_por_toma: 5
  ancho_trabajo: 960
luz:
  ancla_negros: 0.08           # hipótesis (observado 0.06-0.10)
  ancla_blancos: 0.95          # hipótesis (observado 0.93-0.97)
  fuerza: 1.0
  max_estiramiento: 1.5        # (prov)
  piel_objetivo: 0.585         # (cal 21-oct) luma de la piel tras la curva; el resultado final sale ~0.57 (su media) 
  ev_min: -1.0
  ev_max: 1.6
  ev_peso: 1.0
  s_k: 0.517                   # (cal toma 02) forma de los medios
  s_c: 0.542
look:
  piel_sin_enfriar: 1.0        # la piel NO se enfría ni pierde rojo (máscara de matiz como el HSL secundario de Premiere)
  rojo_extra: 0.965            # (cal 21-oct-2026) 7 tomas de 3 videos de Cris (Colaboradores/Nativos/Regreso): su grado trae ~3,5 % menos rojo (0.946 midió -2 % de más) que el mio a igual verde
  enfriamiento_t: 0.055        # (cal) mediana de dln(R/B) = -0.105 entre rec709 e iluminación, ambas tomas
  lut_creativo: auto           # por cabecera TITLE "Generated by Resolve"
  intensidad: 0.5              # medido 0.466 / 0.517 (MAE 0.0014 con 0.517 en toma 02)
  curva_roja: off
  hsl_inverso:                 # (cal toma 02, MAE 0.0069)
    proteger_matiz_grados: [-15.0, 23.5]
    feather_grados: 21.2
    sat_min: 0.086
    temperatura: 0.062
    tinte: 0.0
    saturacion: 1.12  
  vineta:                      # (cal toma 02, MAE 0.0054) p(r)=1+A*max(0,r-r0)^k ; salida = entrada^p ; r circular / semidiagonal
    A: 0.3141
    r0: 0.0
    k: 2.0513
